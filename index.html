<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a080f">
  <meta name="description" content="دعوة زفاف محمد وأمينة — الخميس، 10 ديسمبر 2026">
  <title>محمد وأمينة | دعوة زفاف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Noto+Kufi+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --wine:#5a0c1c;
      --wine-deep:#330710;
      --ivory:#f7f0e2;
      --paper:#fbf6ea;
      --ink:#3c2822;
      --gold:#a88b59;
      --shadow:rgba(24,8,8,.52);
      --ease:cubic-bezier(.22,.61,.36,1);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;background:#1d0509}
    body{color:var(--ivory);font-family:"Noto Kufi Arabic",sans-serif;overflow-x:hidden}
    button{font:inherit}

    .scene{
      min-height:100svh;
      height:100svh;
      position:relative;
      isolation:isolate;
      overflow:hidden;
      background:url("assets/images/atelier-bg.webp") center/cover no-repeat;
    }
    .scene::after{
      content:"";
      position:absolute;inset:0;z-index:-1;pointer-events:none;
      background:linear-gradient(180deg,rgba(30,4,8,.08),rgba(20,3,6,.16));
    }

    /* The opening is one physical tabletop scene. */
    .opening{
      position:absolute;inset:0;z-index:10;
      display:grid;place-items:center;
      padding:clamp(16px,4vw,48px);
      perspective:1400px;
      pointer-events:auto;
    }
    .envelope-stage{
      width:min(92vw,760px);
      height:min(78svh,650px);
      position:relative;
      display:grid;place-items:center;
    }

    /* The existing envelope artwork is treated as a physical object, not a page background. */
    .envelope{
      width:min(94%,700px);
      aspect-ratio:1.13/1;
      position:relative;
      transform-style:preserve-3d;
      filter:drop-shadow(0 30px 34px var(--shadow));
      transform:translateY(2vh);
    }
    .envelope-img{
      position:absolute;inset:0;
      background:url("assets/images/envelope.png") center/contain no-repeat;
      pointer-events:none;
      z-index:4;
    }

    /* A narrow physical reveal zone gives the paper a convincing upward exit. */
    .paper-slot{
      position:absolute;
      left:50%;
      bottom:18%;
      width:58%;
      height:58%;
      transform:translateX(-50%);
      overflow:hidden;
      z-index:2;
      pointer-events:none;
    }
    .invitation-card{
      position:absolute;
      left:50%;
      bottom:-66%;
      width:100%;
      height:auto;
      display:block;
      transform:translateX(-50%);
      filter:drop-shadow(0 18px 22px rgba(0,0,0,.30));
      transition:bottom 1150ms var(--ease),transform 1150ms var(--ease);
    }

    .ribbon-img{
      position:absolute;
      top:12%;
      left:50%;
      transform:translateX(-50%);
      width:24%;
      height:auto;
      z-index:5;
      pointer-events:none;
      opacity:.98;
    }

    .seal-button{
      position:absolute;z-index:7;
      left:50%;top:53.5%;
      width:clamp(88px,16vw,126px);
      aspect-ratio:1;
      transform:translate(-50%,-50%);
      padding:0;border:0;border-radius:50%;
      background:none;cursor:pointer;
      filter:drop-shadow(0 12px 18px rgba(0,0,0,.48));
      transition:transform 160ms ease,filter 250ms ease;
      -webkit-tap-highlight-color:transparent;
    }
    .seal-button:hover{filter:drop-shadow(0 15px 21px rgba(0,0,0,.55))}
    .seal-button:active{transform:translate(-50%,-50%) scale(.93)}
    .seal-button:focus-visible{outline:2px solid #d8c59f;outline-offset:8px}
    .seal-button img{display:block;width:100%;height:100%;object-fit:contain}

    /* After opening, the invitation becomes the hero while the envelope remains behind it. */
    .scene.is-open .paper-slot{z-index:8;overflow:visible}
    .scene.is-open .invitation-card{
      bottom:4%;
      transform:translateX(-50%);
    }
    .scene.is-open .envelope{
      transform:translateY(10vh) scale(.88);
      transition:transform 1150ms var(--ease);
      opacity:.88;
    }
    .scene.is-open .ribbon-img{
      opacity:.45;
      transition:opacity 600ms ease;
    }
    .scene.is-open .seal-button{
      pointer-events:none;
      opacity:0;
      transform:translate(-50%,-50%) scale(.78);
      transition:opacity 260ms ease,transform 500ms var(--ease);
    }

    .invitation-wrap{
      position:absolute;inset:0;z-index:6;
      display:grid;place-items:center;
      padding:18px;
      pointer-events:none;
    }
    .invitation{
      position:relative;
      width:min(82vw,520px);
      max-height:calc(100svh - 28px);
      color:var(--ink);
      text-align:center;
      opacity:0;
      transform:translateY(10px) scale(.985);
      transition:opacity 550ms ease 1050ms,transform 850ms var(--ease) 1050ms;
      pointer-events:none;
      outline:none;
    }
    .invitation::before{
      content:"";
      display:block;
      padding-top:142%;
      background:url("assets/images/invitation card.png") center/100% 100% no-repeat;
      filter:drop-shadow(0 26px 34px rgba(0,0,0,.42));
    }
    .scene.is-open .invitation-wrap{z-index:12}
    .scene.is-open .invitation{
      opacity:1;
      transform:none;
      pointer-events:auto;
    }

    .card-content{
      position:absolute;
      inset:8% 10% 9%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(7px,1.4vh,14px);
    }
    .basmala{
      font-family:"Aref Ruqaa Ink",serif;
      font-size:clamp(1rem,3.1vw,1.35rem);
      color:var(--wine);
      margin:0;
    }
    .verse{
      max-width:88%;
      margin:0;
      font-family:"Aref Ruqaa Ink",serif;
      font-size:clamp(.72rem,2.1vw,.94rem);
      line-height:1.95;
      color:#50372f;
    }
    .verse-source{
      margin:-2px 0 3px;
      font-family:"Aref Ruqaa Ink",serif;
      font-size:clamp(.62rem,1.7vw,.76rem);
      color:#76594a;
    }
    .invite-line{
      margin:4px 0 0;
      font-family:"Aref Ruqaa Ink",serif;
      font-size:clamp(.78rem,2.25vw,1rem);
      line-height:1.8;
      color:#50372f;
    }
    .names{
      margin:0;
      font-family:"Aref Ruqaa Ink",serif;
      font-size:clamp(2rem,8vw,3.8rem);
      line-height:1.05;
      color:var(--wine);
      letter-spacing:.01em;
    }
    .names .amp{
      display:inline-block;
      margin:0 .12em;
      font-size:.42em;
      color:var(--gold);
      vertical-align:.18em;
    }
    .details{
      display:flex;
      flex-direction:column;
      gap:4px;
      margin-top:2px;
      font-size:clamp(.62rem,1.8vw,.8rem);
      line-height:1.7;
      color:#5b4037;
    }
    .detail-strong{color:var(--wine);font-weight:500}
    .ornament{
      width:clamp(90px,25vw,150px);
      height:auto;
      opacity:.82;
      margin:2px 0;
    }
    .swan-mark{
      width:clamp(66px,18vw,105px);
      height:auto;
      opacity:.9;
      filter:drop-shadow(0 3px 4px rgba(80,40,20,.12));
    }

    @media(max-width:520px){
      .opening{padding:10px}
      .envelope-stage{height:70svh}
      .envelope{width:100%}
      .ribbon-img{width:29%;top:13%}
      .paper-slot{bottom:17%;width:63%;height:58%}
      .scene.is-open .envelope{transform:translateY(9vh) scale(.82)}
      .invitation-wrap{padding:10px}
      .invitation{width:min(88vw,500px)}
      .card-content{inset:7% 8% 8%;gap:5px}
      .verse{max-width:92%;line-height:1.75}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
      .invitation-card{bottom:4%}
      .scene.is-open .envelope{transform:translateY(8vh) scale(.84)}
      .invitation{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <section class="opening" aria-label="ظرف دعوة الزفاف">
      <div class="envelope-stage">
        <div class="envelope">
          <div class="paper-slot" aria-hidden="true">
            <img class="invitation-card" src="assets/images/invitation card.png" alt="">
          </div>
          <div class="envelope-img" aria-hidden="true"></div>
          <img class="ribbon-img" src="assets/images/burgundy silk ribbon.png" alt="" aria-hidden="true">
          <button class="seal-button" id="openInvitation" type="button" aria-controls="invitation" aria-expanded="false" aria-label="اضغط على الختم لفتح الدعوة">
            <img src="assets/images/wax-seal-ma.png" alt="">
          </button>
        </div>
      </div>
    </section>

    <section class="invitation-wrap" id="invitation" aria-labelledby="card-title" aria-hidden="true">
      <article class="invitation" id="card" tabindex="-1">
        <div class="card-content">
          <img class="swan-mark" src="assets/images/swan-emblem-primary.png" alt="" aria-hidden="true">
          <p class="basmala">بسم الله الرحمن الرحيم</p>
          <p class="verse">وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً</p>
          <p class="verse-source">صدق الله العظيم</p>
          <img class="ornament" src="assets/images/lace ornament.png" alt="" aria-hidden="true">
          <p class="invite-line">يتشرف</p>
          <h1 class="names" id="card-title">محمد <span class="amp">&amp;</span> أمينة</h1>
          <p class="invite-line">بدعوتكم لمشاركتهم فرحة زفافهما</p>
          <div class="details">
            <span class="detail-strong">الخميس، 10 ديسمبر 2026</span>
            <span>الساعة السادسة مساءً</span>
            <span>قاعة مسك الليل، سيدي بلعباس</span>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const button = document.getElementById("openInvitation");
    const invitation = document.getElementById("invitation");
    const card = document.getElementById("card");

    button.addEventListener("click", () => {
      if (scene.classList.contains("is-open")) return;
      scene.classList.add("is-open");
      button.setAttribute("aria-expanded", "true");
      invitation.setAttribute("aria-hidden", "false");

      window.setTimeout(() => {
        card.focus({preventScroll:true});
      }, 1750);
    });
  </script>
</body>
</html>
