<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelecanus - Mohamed & Amina Wedding</title>
    <meta name="description" content="Pelecanus? ISNT IT A SLOGAN FOR LOVE? - Wedding Invitation for Mohamed & Amina">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #800020 0%, #a52a2a 50%, #c4a4a4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .envelope-container {
            position: relative;
            cursor: pointer;
            perspective: 1000px;
        }
        
        .envelope {
            width: 400px;
            height: 300px;
            background: #800020;
            position: relative;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: transform 0.6s ease;
        }
        
        .envelope:hover {
            transform: translateY(-10px);
        }
        
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-top: 150px solid #900020;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 10;
        }
        
        .envelope-flap::after {
            content: '🦢';
            position: absolute;
            top: -120px;
            left: -20px;
            font-size: 40px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 200px solid #700020;
            border-right: 200px solid #700020;
            border-bottom: 160px solid #600015;
            border-radius: 0 0 10px 10px;
            z-index: 5;
        }
        
        .invitation-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 260px;
            background: linear-gradient(135deg, #f5f5f5 0%, #fff5f5 100%);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.8s ease 0.3s;
            z-index: 3;
            opacity: 0;
            border: 3px solid #c4a4a4;
        }
        
        .envelope.open .invitation-card {
            transform: translate(-50%, -150%);
            opacity: 1;
            z-index: 15;
        }
        
        .lace-border {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px dashed #c4a4a4;
            border-radius: 5px;
            pointer-events: none;
        }
        
        .pelecanus-header {
            font-size: 18px;
            color: #c4a4a4;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .couple-names {
            font-size: 32px;
            color: #800020;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .wedding-date {
            font-size: 18px;
            color: #a52a2a;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        .venue {
            font-size: 16px;
            color: #600015;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .message {
            font-size: 14px;
            color: #800020;
            margin-top: 15px;
            font-style: italic;
        }
        
        .slogan {
            font-size: 13px;
            color: #a52a2a;
            margin-top: 10px;
            font-weight: bold;
            font-style: italic;
        }
        
        .rsvp {
            font-size: 13px;
            color: #600015;
            margin-top: 12px;
            font-weight: bold;
        }
        
        .click-hint {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        .scratch-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #800020, #a52a2a);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            z-index: 100;
            transition: transform 0.5s ease;
            text-align: center;
            border: 4px solid #c4a4a4;
        }
        
        .scratch-card.show {
            transform: translate(-50%, -50%) scale(1);
        }
        
        .scratch-card h2 {
            color: white;
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        .pelecanus-badge {
            background: #c4a4a4;
            color: #800020;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        
        .scratch-area {
            width: 250px;
            height: 100px;
            background: silver;
            margin: 20px auto;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .scratch-reveal {
            position: absolute;
            color: #800020;
            font-size: 24px;
            font-weight: bold;
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
        }
        
        .scratch-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #c0c0c0, #d8d8d8, #c0c0c0);
            cursor: pointer;
            transition: opacity 0.5s;
        }
        
        .scratch-overlay.scratched {
            opacity: 0;
        }
        
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>
    <div class="envelope-container" onclick="openEnvelope()">
        <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="invitation-card">
                <div class="lace-border"></div>
                <div class="pelecanus-header">🦢 Pelecanus</div>
                <div class="couple-names">Mohamed & Amina</div>
                <div class="wedding-date">December 10, 2026 at 18:00</div>
                <div class="venue">📍 Mesk El Lil</div>
                <div class="message">"We love life"</div>
                <div class="slogan">Pelecanus? ISNT IT A SLOGAN FOR LOVE?</div>
                <div class="rsvp">RSVP: 0556564140</div>
            </div>
            <div class="envelope-pocket"></div>
        </div>
        <div class="click-hint">Click to open 💌</div>
    </div>
    
    <div class="scratch-card" id="scratchCard">
        <button class="close-btn" onclick="closeScratch()">&times;</button>
        <div class="pelecanus-badge">🦢 Pelecanus</div>
        <h2>Save The Date! 💍</h2>
        <p style="color: white; margin-bottom: 15px;">Scratch to reveal the special date:</p>
        <div class="scratch-area">
            <div class="scratch-reveal">December 10, 2026</div>
            <div class="scratch-overlay" id="scratchOverlay" onclick="scratchCard()"></div>
        </div>
        <p style="color: #f5f5f5; font-size: 14px;">We can't wait to celebrate with you!</p>
    </div>
    
    <script>
        function openEnvelope() {
            const envelope = document.getElementById('envelope');
            envelope.classList.add('open');
            
            setTimeout(() => {
                document.getElementById('scratchCard').classList.add('show');
            }, 1000);
        }
        
        function closeScratch() {
            document.getElementById('scratchCard').classList.remove('show');
        }
        
        function scratchCard() {
            document.getElementById('scratchOverlay').classList.add('scratched');
        }
    </script>
</body>
</html>
