<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24040a">
  <meta name="description" content="دعوة زفاف محمد وأمينة — الخميس، 10 ديسمبر 2026">
  <title>محمد وأمينة | دعوة زفاف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Noto+Kufi+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --night:#24040a;
      --bordeaux:#3b0711;
      --wine:#610d20;
      --wine-light:#7d2034;
      --ivory:#f5efe3;
      --paper:#fbf5ea;
      --champagne:#e9ddc9;
      --gold:#b89a61;
      --gold-soft:#cdbb9b;
      --ink:#38231f;
      --ease:cubic-bezier(.22,.61,.36,1)
    }
    *{box-sizing:border-box}
    html{background:var(--night);scroll-behavior:smooth}
    body{margin:0;min-width:320px;background:var(--night);color:var(--ivory);font-family:"Noto Kufi Arabic",sans-serif;overflow-x:hidden}
    button{font:inherit}

    .scene{
      min-height:100svh;
      position:relative;
      isolation:isolate;
      overflow:hidden;
      background:
        url("assets/images/atelier-bg.webp") center / cover no-repeat;
    }

    .grain{
      position:absolute;inset:0;z-index:-5;opacity:.15;pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.7'/%3E%3C/svg%3E");
      mix-blend-mode:soft-light
    }

    .ambient{
      position:absolute;inset:0;z-index:-4;pointer-events:none;
      background:
        radial-gradient(ellipse at 50% 95%, rgba(189,125,78,.12), transparent 45%),
        radial-gradient(circle at 50% 18%, rgba(238,203,150,.06), transparent 28%);
      mix-blend-mode:screen
    }

    .opening{
      position:absolute;inset:0;
      display:grid;place-items:center;
      padding:clamp(18px,5vw,64px);
      perspective:1600px;
      transition:opacity 900ms ease,visibility 0s linear 1000ms
    }

    .envelope-stage{
      width:min(95vw,800px);
      position:relative;
      display:grid;place-items:center;
      padding-block:24px
    }

    /* Bigger envelope */
    .envelope{
      width:min(90vw,720px); /* أكبر */
      aspect-ratio:1.13/1;
      position:relative;
      transform-style:preserve-3d;
      filter:drop-shadow(0 35px 50px rgba(0,0,0,.55));
    }

    /* Envelope as a single transparent PNG layer */
    .envelope-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:
        url("assets/images/envelope.png") center / contain no-repeat;
      pointer-events:none;
      z-index:1
    }

    /* Burgundy silk ribbon as an image element - smaller */
    .ribbon-img{
      position:absolute;
      top:15%;
      left:50%;
      transform:translateX(-50%);
      width:35%;
      height:auto;
      pointer-events:none;
      z-index:2;
      opacity:.95
    }

    /* Wax seal as a physical object on top */
    .seal-button{
      position:absolute;z-index:3;
      left:50%;top:53.5%;
      width:clamp(96px,23vw,136px);aspect-ratio:1;
      transform:translate(-50%,-50%);
      padding:0;border:0;border-radius:50%;
      background:transparent;cursor:pointer;
      filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));
      transition:transform 160ms ease,filter 300ms ease;
      -webkit-tap-highlight-color:transparent;
      tap-highlight-color:transparent;
      outline:none
    }
    .seal-button::before{
      content:"";position:absolute;inset:16%;border-radius:50%;
      background:radial-gradient(circle, rgba(205,187,155,.6), transparent 68%);
      opacity:0;transform:scale(.65);
      transition:opacity 260ms ease,transform 420ms var(--ease);z-index:-1
    }
    .seal-button:hover::before,.seal-button:focus-visible::before{
      opacity:.75;transform:scale(1.4)
    }
    .seal-button:active{
      transform:translate(-50%,-50%) scale(.93)
    }
    .seal-button:focus:not(:focus-visible){outline:none}
    .seal-button:focus-visible{
      outline:2px solid var(--gold-soft);
      outline-offset:8px
    }
    .seal-button img{
      display:block;width:100%;height:100%;object-fit:contain
    }

    .opening-kicker{
      margin:0 0 .8rem;
      color:var(--gold-soft);
      font-size:.66rem;letter-spacing:.19em;text-align:center
    }

    .scene.is-open .seal-button{
      pointer-events:none;
      animation:release 520ms var(--ease) forwards
    }
    .scene.is-open .opening{
      opacity:0;visibility:hidden
    }

    .invitation-wrap{
      position:relative;z-index:4;
      width:min(100%,780px);
      margin:0 auto;
      padding:clamp(28px,6vw,70px) clamp(14px,4vw,30px) clamp(46px,9vw,100px);
      opacity:0;
      transform:translateY(90px) scale(.94);
      pointer-events:none;
      transition:opacity 720ms ease 760ms,transform 1100ms var(--ease) 760ms
    }
    .scene.is-open .invitation-wrap{
      opacity:1;transform:translateY(0) scale(1);pointer-events:auto
    }

    /* Invitation card */
    .invitation{
      position:relative;
      min-height:130svh;
      overflow:hidden;
      color:var(--ink);
      text-align:center;
      width:min(90vw, 720px);
      margin: 0 auto;
      border-radius: 12px;
      background:
        url("assets/images/invitation card.png") center / contain no-repeat;
      box-shadow:
        0 30px 80px rgba(0,0,0,.48),
        0 10px 30px rgba(0,0,0,.35),
        inset 0 0 40px rgba(137,92,49,.09);
      padding:clamp(70px,14vw,130px) clamp(32px,10vw,110px) clamp(80px,15vw,140px)
    }

    /* Paper fibers / grain - same quality */
    .invitation::before{
      content:"";
      position:absolute;
      inset:0;
      opacity:.22;
      pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paper'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23paper)' opacity='.26'/%3E%3C/svg%3E");
      mix-blend-mode:multiply
    }

    /* Edge depth / warmth - same quality */
    .invitation::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(130% 130% at 50% 50%,
          rgba(120,90,70,0) 52%,
          rgba(120,90,70,.07) 100%);
      pointer-events:none;
      mix-blend-mode:multiply
    }

    .paper-swan{
      position:absolute;
      top:3%;
      right:50%;
      width:min(78vw,500px);
      height:auto;
      transform:translateX(50%);
      opacity:.028;
      filter:sepia(.22);
      pointer-events:none
    }

    .card-emblem{
      display:block;
      width:clamp(130px,30vw,200px);
      height:auto;
      margin:0 auto 2rem;
      filter:drop-shadow(0 6px 8px rgba(90,50,20,.13));
      opacity:0;
      transform:translateY(14px)
    }

    .scene.is-open .card-emblem{animation:rise 720ms var(--ease) 1290ms forwards}

    @keyframes release{
      0%{transform:translate(-50%,-50%) scale(1)}
      45%{transform:translate(-50%,-50%) scale(.91)}
      100%{transform:translate(-50%,-50%) scale(.72);opacity:0;filter:drop-shadow(0 5px 8px rgba(0,0,0,.2))}
    }
    @keyframes rise{to{opacity:1;transform:translateY(0) scale(1)}}

    @media(max-width:480px){
      .opening{padding:16px}
      .envelope{width:min(95vw,560px)}
      .envelope-stage{padding-block:6px}

      .ribbon-img{
        top:18%;
        width:45%
      }

      .invitation-wrap{padding-inline:10px;padding-top:20px}

      .invitation{
        width:95vw;
        padding:60px 20px 80px;
        border-radius:10px;
        min-height:140svh
      }
      .invitation::before{inset:0}
      .invitation::after{inset:0}

      .paper-swan{width:98vw;top:6%}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
      .opening{display:none}
      .invitation-wrap{opacity:1;transform:none;pointer-events:auto}
      .invitation{min-height:130svh}
      .card-emblem{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="grain" aria-hidden="true"></div><div class="ambient" aria-hidden="true"></div>

    <section class="opening" aria-label="ظرف دعوة الزفاف">
      <div class="envelope-stage">
        <p class="opening-kicker">دعوة زفاف</p>
        <div class="envelope" aria-label="ظرف زفاف مختوم">
          <!-- Envelope as a single transparent PNG layer -->
          <div class="envelope-img" aria-hidden="true"></div>

          <!-- Burgundy silk ribbon as an image element - smaller -->
          <img class="ribbon-img" src="assets/images/burgundy silk ribbon.png" alt="" aria-hidden="true">

          <!-- Wax seal -->
          <button class="seal-button" id="openInvitation" type="button" aria-controls="invitation" aria-expanded="false" aria-label="اضغط على الختم لفتح الدعوة">
            <img src="assets/images/wax-seal-ma.png" alt="">
          </button>
        </div>
      </div>
    </section>

    <section class="invitation-wrap" id="invitation" aria-labelledby="card-title" aria-hidden="true">
      <article class="invitation">
        <img class="paper-swan" src="assets/images/swan-emblem-primary.png" alt="" aria-hidden="true">

        <!-- Optional emblem on top of the card image -->
        <img class="card-emblem" src="assets/images/swan-emblem-primary.png" alt="شعار بجعتين مع مونوغرام م وأ" id="card-title">
      </article>
    </section>
  </main>
  <script>
    const scene=document.getElementById('scene');
    const button=document.getElementById('openInvitation');
    const invitation=document.getElementById('invitation');
    button.addEventListener('click',()=>{
      scene.classList.add('is-open');
      button.setAttribute('aria-expanded','true');
      invitation.setAttribute('aria-hidden','false');
      window.setTimeout(()=>document.getElementById('card-title').focus(),2850)
    });
  </script>
</body>
</html>
