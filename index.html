<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b0711">
  <meta name="description" content="دعوة زفاف محمد وأمينة — 10 ديسمبر 2026">
  <title>محمد & أمينة | دعوة زفاف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Noto+Kufi+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bordeaux:#3b0711;--wine:#610d20;--wine-deep:#200307;--ivory:#f5eee1;--ivory-deep:#e6d6bd;--gold:#b99a62;--gold-soft:#d5bf91;--ink:#44261f;}
    *{box-sizing:border-box}html{background:var(--bordeaux);scroll-behavior:smooth}body{margin:0;min-width:320px;background:var(--bordeaux);color:var(--ivory);font-family:"Noto Kufi Arabic",sans-serif;overflow-x:hidden}button{font:inherit}.experience{position:relative;min-height:100svh;isolation:isolate;overflow:hidden}.texture{position:absolute;inset:0;z-index:-5;opacity:.18;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.78'/%3E%3C/svg%3E");mix-blend-mode:soft-light}.vignette{position:absolute;inset:0;z-index:-4;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(120,24,45,.48),transparent 43%),radial-gradient(circle at 50% 50%,transparent 40%,rgba(10,0,3,.7) 125%)}.opening,.hero{min-height:100svh;display:grid;place-items:center;padding:clamp(22px,6vw,72px)}.opening{position:relative;transition:opacity 850ms ease,transform 1050ms cubic-bezier(.22,.61,.36,1);background:radial-gradient(circle at 50% 43%,rgba(111,18,38,.42),transparent 43%)}.opening-inner{width:min(100%,700px);text-align:center;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2}.floral{position:absolute;z-index:0;width:clamp(245px,47vw,540px);max-width:55%;height:auto;pointer-events:none;filter:drop-shadow(0 18px 25px rgba(0,0,0,.23));transition:opacity .8s ease,transform 1.1s cubic-bezier(.22,.61,.36,1)}.floral-top{top:-3.4%;right:-6%;transform:rotate(2deg)}.floral-bottom{bottom:-6%;left:-7%;transform:rotate(-1deg)}.eyebrow{margin:0 0 1rem;color:var(--gold-soft);font-size:clamp(.62rem,1.8vw,.79rem);letter-spacing:.2em;font-weight:500;opacity:0;transform:translateY(8px);animation:rise .8s ease .12s forwards}.swan-opening{display:block;width:clamp(178px,40vw,295px);max-height:30svh;object-fit:contain;filter:drop-shadow(0 9px 18px rgba(0,0,0,.28));margin:0 auto .75rem;opacity:0;transform:translateY(12px) scale(.975);animation:rise 1s cubic-bezier(.22,.61,.36,1) .25s forwards}.names{margin:.1rem 0 0;font-family:"Aref Ruqaa Ink",serif;font-size:clamp(3.1rem,12vw,6.8rem);font-weight:400;line-height:.87;text-shadow:0 8px 24px rgba(0,0,0,.24);opacity:0;transform:translateY(12px);animation:rise .9s cubic-bezier(.22,.61,.36,1) .43s forwards}.amp{display:block;color:var(--gold-soft);direction:ltr;font-family:Georgia,serif;font-size:clamp(1.15rem,3vw,1.6rem);font-style:italic;line-height:1;margin:.34rem 0}.date{margin:1.25rem 0 1.7rem;color:var(--gold-soft);font-size:clamp(.75rem,2.1vw,.98rem);letter-spacing:.12em;font-weight:500;opacity:0;transform:translateY(10px);animation:rise .8s ease .57s forwards}.seal-control{position:relative;width:clamp(108px,26vw,142px);aspect-ratio:1;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center;filter:drop-shadow(0 13px 18px rgba(0,0,0,.35));opacity:0;transform:translateY(12px);animation:rise .9s cubic-bezier(.22,.61,.36,1) .68s forwards}.seal-control::before{content:"";position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle,rgba(213,191,145,.54),transparent 67%);opacity:0;transform:scale(.62);transition:opacity .35s ease,transform .45s ease;z-index:-1}.seal-control:hover::before,.seal-control:focus-visible::before{opacity:.9;transform:scale(1.3)}.seal-control:active{transform:translateY(12px) scale(.94)}.seal-control:focus-visible{outline:2px solid var(--ivory);outline-offset:7px;border-radius:50%}.seal-control img{display:block;width:100%;height:100%;object-fit:contain}.seal-label{position:absolute;inset:0;display:grid;place-items:center;color:var(--ivory);font-size:clamp(.58rem,1.7vw,.72rem);font-weight:600;line-height:1.85;text-shadow:0 2px 7px rgba(0,0,0,.65);pointer-events:none}.opening-note{margin:1rem 0 0;color:rgba(245,238,225,.66);font-size:.62rem;letter-spacing:.08em;opacity:0;animation:appear .8s ease .86s forwards}.hero{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(34px) scale(.986);transition:opacity 850ms ease 390ms,transform 1150ms cubic-bezier(.22,.61,.36,1) 390ms;background:linear-gradient(180deg,#eee2cf 0%,#f8f1e6 48%,#e7d7bd 100%);color:var(--ink);overflow:hidden}.hero::before{content:"";position:absolute;inset:12px;border:1px solid rgba(185,154,98,.52);pointer-events:none}.hero-card{position:relative;width:min(100%,720px);padding:clamp(32px,8vw,76px) clamp(22px,7vw,70px);text-align:center}.ivory-corner{position:absolute;width:clamp(150px,29vw,290px);height:auto;bottom:0;right:-2%;opacity:.46;pointer-events:none;mix-blend-mode:multiply}.swan-watermark{position:absolute;z-index:-1;width:min(75vw,500px);height:auto;top:0;right:50%;transform:translateX(50%);opacity:.055;filter:sepia(.4);pointer-events:none}.swan-hero{display:block;width:clamp(140px,31vw,230px);max-height:24svh;object-fit:contain;margin:0 auto 1.25rem;filter:drop-shadow(0 5px 8px rgba(87,44,24,.12));opacity:0;transform:translateY(14px) scale(.98)}.basmala{margin:0 0 1.35rem;font-family:"Aref Ruqaa Ink",serif;color:var(--wine);font-size:clamp(1.22rem,4.2vw,1.95rem);opacity:0;transform:translateY(12px)}.invite-copy{margin:0 auto;max-width:32rem;color:#573b33;font-size:clamp(.8rem,2.3vw,1rem);line-height:2.18;opacity:0;transform:translateY(12px)}.divider{display:block;width:min(270px,67vw);height:auto;margin:1.25rem auto .9rem;opacity:0;transform:translateY(10px)}.hero-names{margin:.55rem 0 0;font-family:"Aref Ruqaa Ink",serif;color:var(--wine);font-size:clamp(3rem,11vw,6.55rem);line-height:.9;font-weight:400;opacity:0;transform:translateY(13px)}.hero-date{margin:1.25rem 0 0;color:#755536;font-size:clamp(.73rem,2vw,.91rem);letter-spacing:.1em;font-weight:600;opacity:0;transform:translateY(10px)}.experience.is-open .opening{opacity:0;transform:scale(1.045);pointer-events:none}.experience.is-open .floral-top{transform:translate(7%,-8%) rotate(4deg);opacity:0}.experience.is-open .floral-bottom{transform:translate(-7%,9%) rotate(-4deg);opacity:0}.experience.is-open .hero{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.experience.is-open .swan-hero{animation:rise 800ms cubic-bezier(.22,.61,.36,1) 900ms forwards}.experience.is-open .basmala{animation:rise 760ms ease 1080ms forwards}.experience.is-open .invite-copy{animation:rise 760ms ease 1230ms forwards}.experience.is-open .divider{animation:rise 700ms ease 1380ms forwards}.experience.is-open .hero-names{animation:rise 850ms cubic-bezier(.22,.61,.36,1) 1510ms forwards}.experience.is-open .hero-date{animation:rise 680ms ease 1670ms forwards}@keyframes rise{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes appear{to{opacity:1}}@media(max-width:480px){.opening,.hero{padding:18px}.floral{max-width:64%;width:270px}.floral-top{right:-18%;top:-2%}.floral-bottom{left:-20%;bottom:-5%}.hero::before{inset:9px}.hero-card{padding:34px 22px 48px}.ivory-corner{width:180px;right:-13%;bottom:-2%}.swan-watermark{width:92vw;top:5%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="experience" id="experience">
    <div class="texture" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
    <section class="opening" aria-labelledby="opening-title">
      <img class="floral floral-top" src="assets/images/floral-top-right.png" alt="" aria-hidden="true">
      <img class="floral floral-bottom" src="assets/images/floral-bottom-left.png" alt="" aria-hidden="true">
      <div class="opening-inner">
        <p class="eyebrow">دعوة زفاف</p>
        <img class="swan-opening" src="assets/images/swan-emblem-primary.png" alt="شعار بجعتين مع مونوغرام م وأ" fetchpriority="high">
        <h1 class="names" id="opening-title">محمد<span class="amp">&amp;</span>أمينة</h1>
        <p class="date">10 ديسمبر 2026</p>
        <button class="seal-control" id="openInvitation" type="button" aria-controls="hero" aria-expanded="false">
          <img src="assets/images/wax-seal-ma.png" alt="">
          <span class="seal-label">افتح<br>الدعوة</span>
        </button>
        <p class="opening-note">بكل الحب والفرح</p>
      </div>
    </section>
    <section class="hero" id="hero" aria-labelledby="hero-title" aria-hidden="true">
      <div class="hero-card">
        <img class="swan-watermark" src="assets/images/swan-emblem-primary.png" alt="" aria-hidden="true">
        <img class="ivory-corner" src="assets/images/ivory-botanical-corner.png" alt="" aria-hidden="true">
        <img class="swan-hero" src="assets/images/swan-emblem-primary.png" alt="" aria-hidden="true">
        <p class="basmala">بسم الله الرحمن الرحيم</p>
        <p class="invite-copy">يتشرف محمد &amp; أمينة<br>بدعوتكم لمشاركتهم فرحة زفافهما</p>
        <img class="divider" src="assets/images/ivory-botanical-divider.png" alt="" aria-hidden="true">
        <h2 class="hero-names" id="hero-title" tabindex="-1">محمد &amp; أمينة</h2>
        <p class="hero-date">الخميس، 10 ديسمبر 2026</p>
      </div>
    </section>
  </main>
  <script>
    const experience=document.getElementById('experience');
    const openButton=document.getElementById('openInvitation');
    const hero=document.getElementById('hero');
    openButton.addEventListener('click',()=>{
      experience.classList.add('is-open');
      openButton.setAttribute('aria-expanded','true');
      hero.setAttribute('aria-hidden','false');
      window.setTimeout(()=>document.getElementById('hero-title').focus(),1750);
    });
  </script>
</body>
</html>
