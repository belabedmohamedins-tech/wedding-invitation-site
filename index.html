<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b0711">
  <meta name="description" content="دعوة زفاف محمد وأمينة — 10 ديسمبر 2026">
  <title>محمد & أمينة | دعوة زفاف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Noto+Kufi+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bordeaux:#3b0711; --wine:#610d20; --wine-deep:#24040a; --ivory:#f4eee1; --ivory-shadow:#ded2bd; --gold:#b89a61; --gold-soft:#d2bd8c; --ink:#381f1d; --line:rgba(184,154,97,.56); }
    * { box-sizing:border-box; }
    html { background:var(--bordeaux); scroll-behavior:smooth; }
    body { margin:0; min-width:320px; color:var(--ivory); background:var(--bordeaux); font-family:"Noto Kufi Arabic", sans-serif; overflow-x:hidden; }
    button { font:inherit; }
    .experience { position:relative; min-height:100svh; isolation:isolate; overflow:hidden; }
    .grain { position:absolute; inset:0; z-index:-1; opacity:.20; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E"); pointer-events:none; mix-blend-mode:soft-light; }
    .vignette { position:absolute; inset:0; z-index:-1; background:radial-gradient(circle at 50% 42%, rgba(120,27,46,.50), transparent 43%), radial-gradient(circle at 50% 50%, transparent 42%, rgba(15,0,4,.58) 120%); pointer-events:none; }
    .opening, .hero { min-height:100svh; display:grid; place-items:center; padding:clamp(24px,6vw,72px); }
    .opening { position:relative; transition:opacity .85s ease, transform .85s ease; }
    .opening-inner { width:min(100%, 680px); text-align:center; display:flex; flex-direction:column; align-items:center; position:relative; }
    .eyebrow { margin:0 0 1.3rem; color:var(--gold-soft); font-size:clamp(.65rem,1.8vw,.8rem); font-weight:500; letter-spacing:.18em; }
    .emblem { width:clamp(180px,43vw,290px); height:clamp(130px,30vw,210px); position:relative; margin:0 auto .6rem; color:var(--gold-soft); opacity:.96; }
    .emblem::before, .emblem::after { content:""; position:absolute; top:9%; width:45%; height:74%; border:1.5px solid currentColor; border-bottom:0; border-radius:80% 50% 65% 46%; opacity:.9; }
    .emblem::before { right:6%; transform:rotate(20deg); }
    .emblem::after { left:6%; transform:scaleX(-1) rotate(20deg); }
    .wing { position:absolute; top:30%; width:34%; height:48%; border-top:1px solid currentColor; border-radius:50%; opacity:.78; }
    .wing.one { right:12%; transform:rotate(-24deg); } .wing.two { left:12%; transform:scaleX(-1) rotate(-24deg); }
    .beak { position:absolute; top:34%; width:30%; height:1px; background:currentColor; opacity:.9; } .beak.one { right:12%; transform:rotate(18deg); } .beak.two { left:12%; transform:rotate(-18deg); }
    .botanical { position:absolute; bottom:3%; width:30%; height:32%; border-bottom:1px solid currentColor; border-radius:50%; opacity:.62; } .botanical.one { right:4%; transform:rotate(15deg); } .botanical.two { left:4%; transform:scaleX(-1) rotate(15deg); }
    .monogram { position:absolute; inset:34% 0 auto; color:var(--ivory); font-family:"Aref Ruqaa Ink", serif; font-size:clamp(1.5rem,5vw,2.45rem); line-height:1; text-shadow:0 2px 16px rgba(0,0,0,.35); }
    .names { margin:.25rem 0 0; font-family:"Aref Ruqaa Ink", serif; font-weight:400; font-size:clamp(3.2rem,12vw,6.8rem); line-height:.88; letter-spacing:.01em; text-shadow:0 8px 25px rgba(0,0,0,.2); }
    .ampersand { display:block; margin:.34rem 0; color:var(--gold-soft); font-family:Georgia,serif; font-size:clamp(1.15rem,3vw,1.6rem); font-style:italic; line-height:1; direction:ltr; }
    .date { margin:1.45rem 0 2.15rem; color:var(--gold-soft); font-size:clamp(.78rem,2.2vw,1rem); font-weight:500; letter-spacing:.12em; }
    .seal-button { appearance:none; position:relative; width:112px; height:112px; display:grid; place-items:center; border:1px solid rgba(210,189,140,.78); border-radius:50%; color:var(--ivory); background:radial-gradient(circle at 35% 30%, #84203a, var(--wine) 58%, #400812 100%); box-shadow:0 12px 25px rgba(0,0,0,.34), inset 0 0 0 5px rgba(255,255,255,.035), inset 0 0 0 7px rgba(184,154,97,.25); cursor:pointer; transition:transform .35s ease, box-shadow .35s ease; }
    .seal-button::before { content:""; position:absolute; inset:10px; border:1px dashed rgba(210,189,140,.65); border-radius:50%; }
    .seal-button span { position:relative; z-index:1; font-size:.7rem; font-weight:500; line-height:1.85; }
    .seal-button:hover { transform:translateY(-4px) rotate(-2deg); box-shadow:0 20px 35px rgba(0,0,0,.4), inset 0 0 0 5px rgba(255,255,255,.035), inset 0 0 0 7px rgba(184,154,97,.25); }
    .seal-button:focus-visible { outline:2px solid var(--ivory); outline-offset:6px; }
    .opening-note { margin:1.15rem 0 0; color:rgba(244,238,225,.62); font-size:.62rem; letter-spacing:.08em; }
    .floral { position:absolute; width:clamp(160px,30vw,330px); aspect-ratio:1; opacity:.48; pointer-events:none; background:radial-gradient(ellipse at 30% 40%, rgba(244,238,225,.56) 0 3%, transparent 3.6%), radial-gradient(ellipse at 43% 33%, rgba(184,154,97,.48) 0 2%, transparent 2.7%), radial-gradient(ellipse at 67% 50%, rgba(119,21,41,.65) 0 8%, transparent 8.6%), repeating-conic-gradient(from 22deg at 65% 50%, rgba(184,154,97,.36) 0 6deg, transparent 6deg 22deg); filter:blur(.1px); }
    .floral.top { top:-7%; right:-11%; transform:rotate(20deg); } .floral.bottom { bottom:-10%; left:-13%; transform:rotate(205deg); }
    .hero { position:absolute; inset:0; opacity:0; transform:translateY(34px) scale(.985); pointer-events:none; transition:opacity 1s ease .18s, transform 1s cubic-bezier(.22,.61,.36,1) .18s; background:linear-gradient(180deg, #f1e8d8 0%, #f7f0e5 52%, #e9dcc6 100%); color:var(--ink); }
    .hero::before { content:""; position:absolute; inset:14px; border:1px solid var(--line); pointer-events:none; }
    .hero-card { width:min(100%, 680px); text-align:center; position:relative; padding:clamp(28px,7vw,72px) clamp(15px,5vw,58px); }
    .hero-watermark { position:absolute; z-index:-1; inset:5% 4% auto; height:72%; opacity:.07; color:var(--wine); filter:sepia(.3); transform:scale(1.16); }
    .hero .emblem { color:var(--gold); width:clamp(140px,36vw,230px); height:clamp(100px,24vw,165px); margin-bottom:1.8rem; }
    .hero .monogram { color:var(--wine); }
    .basmala { margin:0 0 1.7rem; font-family:"Aref Ruqaa Ink", serif; font-size:clamp(1.25rem,4.3vw,2rem); color:var(--wine); }
    .invitation-copy { margin:0 auto; max-width:31rem; font-size:clamp(.8rem,2.35vw,1rem); line-height:2.15; color:#583c36; }
    .hero-names { margin:1.45rem 0 .45rem; font-family:"Aref Ruqaa Ink", serif; font-size:clamp(3.25rem,12vw,6.9rem); line-height:.9; color:var(--wine); font-weight:400; }
    .hero-date { margin:1.5rem 0 0; color:#7a5c3d; font-size:clamp(.73rem,2vw,.9rem); letter-spacing:.12em; font-weight:600; }
    .ornament { width:min(180px,42vw); height:1px; margin:1.45rem auto 0; background:linear-gradient(90deg, transparent, var(--gold), transparent); position:relative; } .ornament::after { content:"✦"; position:absolute; right:50%; top:50%; transform:translate(50%,-55%); color:var(--gold); padding:0 .45rem; background:#f4eadb; }
    .experience.is-open .opening { opacity:0; transform:scale(1.04); pointer-events:none; }
    .experience.is-open .hero { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
    @media (max-width:480px) { .opening { padding-inline:18px; } .hero::before { inset:10px; } .hero-card { padding-inline:22px; } .floral { opacity:.34; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="experience" id="experience">
    <div class="grain" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
    <section class="opening" aria-labelledby="opening-title">
      <div class="floral top" aria-hidden="true"></div><div class="floral bottom" aria-hidden="true"></div>
      <div class="opening-inner">
        <p class="eyebrow">دعوة زفاف</p>
        <div class="emblem" aria-label="رمز طائرين متقابلين مع مونوغرام محمد وأمينة"><i class="wing one"></i><i class="wing two"></i><i class="beak one"></i><i class="beak two"></i><i class="botanical one"></i><i class="botanical two"></i><b class="monogram">م ♥ أ</b></div>
        <h1 class="names" id="opening-title">محمد<span class="ampersand">&amp;</span>أمينة</h1>
        <p class="date">10 ديسمبر 2026</p>
        <button class="seal-button" type="button" id="openInvitation" aria-controls="hero" aria-expanded="false"><span>افتح<br>الدعوة</span></button>
        <p class="opening-note">بكل الحب والفرح</p>
      </div>
    </section>
    <section class="hero" id="hero" aria-labelledby="hero-title" aria-hidden="true">
      <div class="hero-card">
        <div class="emblem hero-watermark" aria-hidden="true"><i class="wing one"></i><i class="wing two"></i><i class="beak one"></i><i class="beak two"></i><i class="botanical one"></i><i class="botanical two"></i></div>
        <div class="emblem" aria-hidden="true"><i class="wing one"></i><i class="wing two"></i><i class="beak one"></i><i class="beak two"></i><i class="botanical one"></i><i class="botanical two"></i><b class="monogram">م ♥ أ</b></div>
        <p class="basmala">بسم الله الرحمن الرحيم</p>
        <p class="invitation-copy">يتشرف محمد &amp; أمينة<br>بدعوتكم لمشاركتهم فرحة زفافهما</p>
        <h2 class="hero-names" id="hero-title">محمد &amp; أمينة</h2>
        <p class="hero-date">الخميس، 10 ديسمبر 2026</p>
        <div class="ornament" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <script>
    const experience = document.getElementById('experience');
    const openButton = document.getElementById('openInvitation');
    const hero = document.getElementById('hero');
    openButton.addEventListener('click', () => {
      experience.classList.add('is-open');
      openButton.setAttribute('aria-expanded', 'true');
      hero.setAttribute('aria-hidden', 'false');
      window.setTimeout(() => hero.querySelector('h2').focus?.(), 700);
    });
  </script>
</body>
</html>
